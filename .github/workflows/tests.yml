            tests/test-lint-diagnostic-destruction.sh
            tests/test-lint-doc-anchors.sh
            tests/test-lint-fix-functions-stderr.sh
            tests/test-lint-module-dependencies.sh
            tests/test-brownfield-wp1-scout.sh
            tests/test-lint-no-live-remote.sh
            tests/test-lint-raw-read-prompt.sh
            tests/test-lint-tests-registered.sh
            tests/test-lint-uat-scenarios.sh
            tests/test-out-of-band-detector.sh
            tests/test-pending-approval-resolve-decision.sh
            tests/test-pending-approval.sh
            tests/test-phase-finalize.sh
            tests/test-phase3-validation-gate.sh
            tests/test-plan-staging.sh
            tests/test-platform-mobile-mcp-docs.sh
            tests/test-platform-security-bugs-closer.sh
            tests/test-pre-commit-gate-classifier.sh
            tests/test-pre-commit-gate-lints.sh
            tests/test-pre-commit-gate-terminal-mode.sh
            tests/test-process-checklist-auto-advance.sh
            tests/test-process-checklist-check-commit-ready-subject.sh
            tests/test-process-checklist-classifier.sh
            tests/test-process-checklist-reset-phase1.sh
            tests/test-prompt-install-noninteractive.sh
            tests/test-reconfigure-field-handlers.sh
            tests/test-record-claude-commit.sh
            tests/test-resolve-tools-memoization.sh
            tests/test-run-lints.sh
            tests/test-scaffold-source-closure.sh
            tests/test-session-test-gate-check-merge.sh
            tests/test-specs-plans-host-aware-quartet.sh
            tests/test-specs-plans-remaining-quartet.sh
            tests/test-walk003-update-command-render.sh
            tests/test-test-gate-counter-sanitizer.sh
            tests/test-test-gate-null-handling.sh
            tests/test-tier-crosscheck-6-followup-atomicity-and-jq.sh
            tests/test-tier-crosscheck-6-zdr-gate.sh
            tests/test-unrecord-feature.sh
            tests/test-upgrade-cdf-refresh.sh
            tests/test-upgrade-interruption.sh
            tests/test-upgrade-manifest-refresh.sh
            tests/test-upgrade-non-interactive.sh
            tests/test-upgrade-paths.sh
            tests/test-upgrade-project-atomic.sh
            tests/test-upgrade-project-retroactive-section.sh
            tests/test-upgrade-sentinel-block.sh
            tests/test-upgrade-sync-framework.sh
            tests/test-upgrade-to-production-preconditions.sh
            tests/test-upgrade-to-production-warn.sh
            tests/test-validate-counter-sanitizer.sh
            tests/test-validate-phase-2-3-gate.sh
            tests/test-validate-phase-state-gates.sh
            tests/test-walk-phase-lifecycle.sh
            tests/test-brownfield-wp2-scout-sections.sh
            tests/test-brownfield-wp3-adoption-arms.sh
            tests/test-brownfield-wp4-driver.sh
            tests/host-drivers/error-translate.test.sh
          )

          # ── BL-190 shard pins ──────────────────────────────────────────
          # These arrays PARTITION the canonical list above; they do not add
          # to it and they must never contain a path that is not in it (the
          # assertion below enforces exactly that). Only the measured long
          # poles are named — `rest` is the complement, so appending to the
          # canonical array above is still the ONLY edit a new test needs.
          #
          # NOTHING BELOW THIS LINE MAY CONTAIN THE LITERAL ARRAY-OPENING
          # TOKEN (the word `tests`, `=`, open-paren). Not in an array name,
          # not in a comment, not inside an echo string.
          # scripts/lint-tests-registered.sh scopes the unit list with
          # `awk '/tests=\(/{f=1;next} f && /^[ ]*\)/{f=0}'` — an UNANCHORED
          # substring match with no comment stripping — so any reappearance
          # of that token re-opens the scope, and every `tests/test-*.sh`
          # path between it and the next lone `)` line gets folded into the
          # lint's membership set. That is a silent widening of an
          # enforcement predicate: a new test file merely NAMED in a comment
          # down here would satisfy the lint while never running in CI —
          # verbatim the BL-181 defect class. `pin_*` names cannot match,
          # and the prose/echo text below is worded to avoid the token.
          # Comment-out is likewise not a move mechanism anywhere in the
          # canonical array: the same awk does not strip comments, so a
          # commented entry still counts as membership while bash drops it
          # (BL-181 residual #2). Move a path BETWEEN pin arrays instead.
          #
          # Seconds are measured CI time from run 30297887329 (main @ 9d71824).
          pin_lint_sweep=(
            tests/test-run-lints.sh                    # 318s — runs the WHOLE lint sweep over the real repo
          )
          pin_lint_scan=(
            tests/test-lint-counter-antipattern.sh     # 243s at pin time — T9 re-scans the real repo; BL-191 made that scan single-pass, so re-measure before repinning
            tests/test-lint-raw-read-prompt.sh         #  41s — real-repo arm
            tests/test-lint-doc-anchors.sh             #  16s — real-repo arm
          )
          pin_sast=(
            tests/test-bl132-sast-index-scan.sh        #  77s on main, 213s on PR #278 — pinned at the worst case
            tests/test-bl131-domsink-rules.sh          #  54s
            tests/test-bl118-sast-dom-xss.sh           #  13s
            tests/test-bl200-syntax-canary.sh          # THE canary (fast): keeps the exact-spelling pin beside the sast toolchain
            # tests/test-bl200-syntax-detector.sh runs in `rest` (the complement), UNPINNED —
            # deliberately. It first landed here and pushed this shard from ~4m46 typical to
            # 6m31, and a slow-registry evening then busted the 12-minute cap mid-run (PR #294
            # round 1, canceled during bl132 with pysemgrep still alive). Per the cap's own
            # doctrine above the timeout-minutes line, approaching the cap is the RE-PIN
            # signal — not a raise. semgrep is installed in EVERY shard (BL-190), so the
            # suite loses nothing by living in `rest` (~3m typical there).
          )
          pin_slow_misc=(
            tests/test-pre-commit-gate-lints.sh        # 122s — runs 4 lint copies inside fixture projects
            tests/test-upgrade-sync-framework.sh       #  37s
            tests/test-plan-staging.sh                 #  34s
            # ── Re-pinned 2026-08-09, measured from runs 31332638444 (main @
            #    faffd7a, complement leg 626s/720s) and 31332771622 (WP8 branch,
            #    complement leg CANCELED at 736s). Nothing failed on that run —
            #    the cap fired. Per the doctrine above, that is the RE-PIN
            #    signal, not a reason to raise the cap.
            tests/test-delta-wp5-hotfix-retro.sh       # 181s — THE long pole of the whole wave, and 3x the next one. It opens and closes deltas dozens of times, and each open now also renders a brief and seeds a ledger row, so it got slower as the feature landed rather than as the test grew
            tests/test-brownfield-wp1-scout.sh         #  55s — the second pole. Moved WITH the first deliberately: the first alone left the complement leg at ~77% of the cap, which is the same "approaching" state the sast note below was written about, and the complement has taken a new suite in nearly every work package this wave
            # ── Re-pinned 2026-08-10. Not a long pole in itself — it is the
            #    GROWTH that moved it. Measured locally: 87s at 125 rows before
            #    the D-A round-3 work, 118s at 158 rows after (~0.75s/row), and
            #    the file gained rows in all three adversarial rounds. The
            #    complement leg was already at 598s/720s on PR #341. A first
            #    draft of this note called the unpinned landing point "roughly
            #    10.5m" by adding only the GROWTH to 598s; review corrected it —
            #    that 598s was measured on MAIN's tree, which carries the 785-line
            #    pre-branch copy of this file, not the branch's 3379-line one. The
            #    real landing point is 598 - t(main's copy) + 118, i.e. ~11.2-11.9m
            #    against the 720s cap. The error ran in the safe direction, but it
            #    understated the case: this pin is closer to necessary than
            #    optional. Per the doctrine above, approaching the cap is the
            #    RE-PIN signal.
            #    The specific cost of not acting: on this stack a complement
            #    cancellation ALREADY hid two real CI-only failures once (a
            #    host-reading probe and a mutant that did not mutate), so a
            #    timeout here does not merely delay the answer — it replaces a
            #    red with a cancellation and the failures go unread.
            tests/test-walk006-ci-protection-scope.sh  # 118s at 158 rows — see note above
          )

          # The ONLY thing that maps a roster name to a pin array. Both the
          # pinned-set build and the dispatch go through this function, so
          # they cannot disagree, and an array with no arm here is simply
          # never claimed — its paths stay in `rest`. `rest` itself pins
          # nothing: it is the computed complement. A roster name with no
          # arm is a hard error, never a silently empty shard.
          pins_for() {
            case "$1" in
              lint-sweep) printf '%s\n' "${pin_lint_sweep[@]}" ;;
              lint-scan)  printf '%s\n' "${pin_lint_scan[@]}" ;;
              sast)       printf '%s\n' "${pin_sast[@]}" ;;
              slow-misc)  printf '%s\n' "${pin_slow_misc[@]}" ;;
              rest)       : ;;
              *) echo "shard roster: '$1' is in the roster but has no arm in pins_for" >&2
                 return 1 ;;
            esac
          }

          # Canonical set, with a duplicate guard (a path listed twice would
          # make the partition arithmetic below lie).
          canon="|"
          for t in "${tests[@]}"; do
            case "$canon" in
              *"|${t}|"*)
                echo "unit list: '${t}' appears twice in the canonical unit array" >&2
                exit 1 ;;
            esac
            canon="${canon}${t}|"
          done

          # Pinned set — built by walking the ROSTER through `pins_for`,
          # never by naming the pin arrays directly. That indirection is
          # what makes an orphaned array fall into `rest` instead of
          # vanishing from CI. Every pin must exist in the canonical list,
          # exactly once, and be claimed by exactly one shard.
          pinned="|"
          n_pinned=0
          for s in $shard_names; do
            shard_pins=$(pins_for "$s") || exit 1
            for t in $shard_pins; do
              case "$canon" in
                *"|${t}|"*) ;;
                *) echo "shard pins: '${t}' is pinned to shard '${s}' but is absent from the canonical unit array" >&2
                   exit 1 ;;
              esac
              case "$pinned" in
                *"|${t}|"*) echo "shard pins: '${t}' is pinned to more than one shard" >&2
                            exit 1 ;;
              esac
              pinned="${pinned}${t}|"
              n_pinned=$((n_pinned + 1))
            done
          done

          # `rest` = canonical minus pinned.
          rest_list=()
          for t in "${tests[@]}"; do
            case "$pinned" in
              *"|${t}|"*) ;;
              *) rest_list+=("${t}") ;;
            esac
          done

          # COVERAGE ASSERTION — the five shards are a partition of the
          # canonical list: disjoint (guarded above) and complete (here).
          # Every shard job re-runs this, so a mis-pin fails the PR loudly
          # instead of silently dropping a test out of CI.
          n_union=$((n_pinned + ${#rest_list[@]}))
          if [ "$n_union" -ne "${#tests[@]}" ]; then
            echo "shard partition is not a cover: shards total ${n_union}, canonical unit array has ${#tests[@]}" >&2
            exit 1
          fi

          # Dispatch through the SAME source the pinned set was built from,
          # so a leg can never run one set while `rest` excludes another.
          # `rest` is the computed complement; membership of $SHARD in the
          # roster was already validated at the top.
          run_list=()
          if [ "${SHARD}" = "rest" ]; then
            run_list=( "${rest_list[@]}" )
          else
            for t in $(pins_for "${SHARD}"); do
              run_list+=("${t}")
            done
          fi

          if [ "${#run_list[@]}" -eq 0 ]; then
            echo "shard '${SHARD}' selected 0 tests — the pin map or the shard name is wrong" >&2
            exit 1
          fi

          echo "shard '${SHARD}': ${#run_list[@]} of ${#tests[@]} unit tests"
          echo "partition verified: ${n_pinned} pinned + ${#rest_list[@]} rest == ${#tests[@]} canonical"

          failed=()
          for t in "${run_list[@]}"; do
            echo "::group::${t}"
            if bash "${t}"; then
              echo "PASS ${t}"
            else
              rc=$?
              echo "FAIL ${t} (rc=${rc})"
              failed+=("${t}")
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "==================================================================="
          echo "Shard ${SHARD}: ran ${#run_list[@]} unit test file(s); ${#failed[@]} failed."
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
          echo "All unit tests in shard ${SHARD} passed."

  # ── Required-check anchor ──────────────────────────────────────────────
  # `unit` is a REQUIRED STATUS CHECK on main (branch protection lists it
  # alongside the eight lint jobs). A matrix cannot keep that name — its
  # check runs are `unit-shard (<shard>)` — and deleting the `unit` context
  # would leave every PR waiting forever on a check that never reports. So
  # the name survives here as a zero-work aggregator that is red unless
  # EVERY shard is green. Same convention as lint.yml: the job name is the
  # branch-protection label — keep it stable.
  #
  # `needs.unit-shard.result` is the matrix's ROLLED-UP result: `success`
  # only when all five legs succeeded. `always()` is required so this job
  # still runs (and still fails) when a shard fails, times out, or is
  # cancelled — a cancelled shard yields `cancelled` here and turns `unit`
  # RED. Note what PR #278's 20m15s cancellation was and was not: it was
  # NOT silent, and it DID block — the check reported and the PR could not
  # merge. The defect was that the lane blocked any PR that ADDED a test,
  # regardless of content. Sharding fixes that; the aggregator exists to
  # keep the required check name reporting at all.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-shard]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    steps:
      - name: Assert every unit shard succeeded
        env:
          SHARD_RESULT: ${{ needs.unit-shard.result }}
        run: |
          set -uo pipefail
          echo "unit-shard (matrix) aggregate result: ${SHARD_RESULT}"
          if [ "${SHARD_RESULT}" != "success" ]; then
            echo "unit: the sharded fast lane did not fully succeed (aggregate result: ${SHARD_RESULT}). Open the unit-shard (…) jobs for the failing shard." >&2
            exit 1
          fi
          echo "unit: all unit-shard legs passed."

  # ── Slow lane (sharded) ────────────────────────────────────────────────
  # Serial, the full suite is ~1h — dominated by ~140 sequential init.sh
  # project scaffolds concentrated in a few heavy aggregators
  # (edge-cases-pre-init: 68, edge-cases-scripts: 41). BL-077 splits it into
  # parallel shards so wall-clock is the slowest single shard (~20 min), not
  # the sum. Coverage is identical to the un-sharded suite:
  #   • core          — master suite with the heavy aggregators skipped
  #                     (SUITE_SKIP_AGGREGATORS=1); still runs TEST 0-8, the
  #                     inline cohorts, and the fast host-drivers aggregator.
  #   • edge-pre-init — tests/edge-cases-pre-init.sh   (68 scaffolds)
  #   • edge-scripts  — tests/edge-cases-scripts.sh    (41 scaffolds)
  #   • aggregators   — the remaining lighter aggregators, run directly.
  # Union of shards == the un-sharded suite. Manual dispatch only (no nightly).
  full:
    name: full (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Manual-only comprehensive sweep. The full suite is a ~3h monolith
    # (200+ init.sh scaffolds); it is NOT scheduled. Sharded for parallelism +
    # failure isolation, but `core` is still the ~3h long pole. Making it
    # CI-fast is deferred (backlog). Give core room to finish.
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [core, edge-pre-init, edge-scripts, aggregators]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          fetch-depth: 0

      - name: Verify tools + configure git identity for scaffolds
        # init.sh / upgrade-project.sh run `git commit` while scaffolding a
        # project; a fresh CI runner has no git identity, so the commit fails
        # (rc=128, "empty ident name not allowed"). Configure one.
        run: |
          jq --version && git --version
          git config --global user.name "solo-orchestrator-ci"
          git config --global user.email "ci@solo-orchestrator.invalid"

      - name: Install semgrep (live SAST cases)
        # BL-118: the live DOM-XSS blocking cases (test-bl118-sast-dom-xss.sh)
        # and the semgrep-REQUIRING BL-112 cases SKIP LOUDLY without semgrep,
        # so without this step the blocking behaviour is never executed in CI —
        # and a renamed/retired registry rule would re-blind every generated
        # hook while CI stayed green (verifier finding, 2026-07-17). The unit
        # lane stays semgrep-free on purpose (a registry fetch on every PR is
        # flake surface); this manual full lane is where the live proof runs.
        # An install failure fails the shard LOUDLY rather than silently
        # skipping the only CI execution of the blocking arm.
        # semgrep is deliberately UNPINNED — Karl's 2026-07-29 decision, recorded with
        # its reasoning on solo-orchestrator-backlog.md § BL-192 (DECISION block): a
        # stale scanner stops catching new vulnerabilities. Do not pin. The generated-
        # project templates float too, sequenced behind BL-198 — see BL-201.
        run: pip install semgrep

      - name: Install expect (BL-180 real interactive scaffold)
        # tests/test-bl180-interactive-scaffold-pty.sh drives a REAL interactive
        # init.sh over a pty. `expect` is its SUPPORTED driver; the script(1)
        # fallback is a positional stream that its own header calls best-effort
        # and that desynchronises on any host where a conditional prompt
        # ("Install Docker via:", CDF's "Install Context7 now?") appears. The
        # runner image is not guaranteed to carry expect, so without this step
        # the only end-to-end proof that a strict project is born with a REAL
        # filesystem gate would silently degrade to the fallback driver.
        # Install failure fails the shard LOUDLY rather than quietly downgrading.
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install gitleaks (pinned + checksum-verified)
        # R-WP2-1, full-lane half. This lane reaches the same suite through
        # tests/full-project-test-suite.sh, on the same runner image that does
        # not ship gitleaks — so the twelve gitleaks-gated cases were skipping
        # here too. Since the suite now FAILS rather than skips when gitleaks
        # is absent and CI is set, this step is REQUIRED for the lane to pass;
        # it is not a nice-to-have that can be dropped to save 2 seconds.
        # Pinned for the same fixture-oracle reason as the unit-shard copy —
        # see the long comment on that step; 8.30.1 is the version every WP2
        # fixture fact was verified against.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          # NOT `sha256sum -c` (R-WP2-6): a malformed pin makes that spelling
          # warn and exit 0, silently verifying nothing. The script computes and
          # compares in the shell, rejects a badly-formed value on EITHER side,
          # and — being a script — has its failure modes executed by the K cases
          # in tests/test-brownfield-wp2-scout-sections.sh.
          bash scripts/ci-verify-sha256.sh /tmp/gitleaks.tar.gz "${GITLEAKS_SHA256}"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run shard — ${{ matrix.shard }}
        # SKIP_KNOWN_FAILING left unset -> 0, so known-RED guards still run.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          case "$SHARD" in
            core)
              SUITE_SKIP_AGGREGATORS=1 bash tests/full-project-test-suite.sh
              ;;
            edge-pre-init)
              bash tests/edge-cases-pre-init.sh
              ;;
            edge-scripts)
              bash tests/edge-cases-scripts.sh
              ;;
            aggregators)
              rc=0
              for t in tests/edge-cases-upgrade-input.sh \
                       tests/edge-case-test-suite.sh \
                       tests/known-bugs-test-suite.sh \
                       tests/upgrade-path-tests.sh; do
                echo "::group::${t}"
                if bash "${t}"; then echo "PASS ${t}"; else echo "FAIL ${t}"; rc=1; fi
                echo "::endgroup::"
              done
              exit "$rc"
              ;;
            *)
              echo "unknown shard: $SHARD" >&2; exit 1
              ;;
          esac
