# solo-orchestrator: platforms=web,desktop,mcp_server
# BL-318-G3-NAME: not `CI`. Adoption installs this file beside a project's own
# workflows, and a project's own is often named CI; two workflows of one name
# cannot be told apart in the Actions tab or in a pull request's checks.
name: Solo Orchestrator checks

# Runs on a push to main and on pull requests to main; a push to any other
# branch runs nothing. A repository whose main branch has another name changes
# both `branches:` lines.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 (v7.0.0)
        with:
          python-version: '3.x'

      # BL-318-G3-INSTALLER: the ONE decision every install and tool step below
      # reads. A uv project (uv.lock with pyproject.toml beside it) installs
      # from its lockfile; any other project from requirements.txt. With
      # neither, the job stops here and says what is missing: a skipped install
      # would let the checks below run against nothing. `shell: bash` gives the
      # step -o pipefail as well as -e, which is how the suite executes it.
      - name: Find the dependency file
        id: deps
        shell: bash
        run: |
          if [ -f uv.lock ] && [ -f pyproject.toml ]; then
            echo "installer=uv" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ]; then
            echo "installer=pip" >> "$GITHUB_OUTPUT"
          else
            missing="requirements.txt"
            [ -f uv.lock ] || missing="$missing, uv.lock"
            [ -f pyproject.toml ] || missing="$missing, pyproject.toml"
            echo "::error::No dependency file to install from. This workflow installs a uv project from uv.lock and pyproject.toml together, and any other project from requirements.txt. Missing: $missing."
            exit 1
          fi

      # BL-318-G3-FAIL-CLOSED: every install, lint, test and security step below
      # is gated on the decision. If the decision step is ever skipped, or fails
      # and is let through, the installer is empty and all of them would skip,
      # leaving a green job that checked nothing. This step turns that red.
      - name: Stop if no installer was chosen
        if: steps.deps.outputs.installer != 'uv' && steps.deps.outputs.installer != 'pip'
        shell: bash
        run: |
          echo "::error::The \"Find the dependency file\" step chose no installer (it was skipped, or failed and was let through), so no install, lint, test or security check would run."
          exit 1

      - name: Install uv
        if: steps.deps.outputs.installer == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # BL-318-G3-UV-SYNC: --frozen installs exactly what uv.lock records and
      # never rewrites it. The dev tools go into the same project environment,
      # where `uv run` finds them; a tool the project already pins stays at
      # its version, and uv.lock is not touched.
      - name: Install dependencies (uv)
        if: steps.deps.outputs.installer == 'uv'
        run: uv sync --frozen

      - name: Install dev tools (uv)
        if: steps.deps.outputs.installer == 'uv'
        run: uv pip install ruff pytest pip-audit pip-licenses

      - name: Install dependencies (pip)
        if: steps.deps.outputs.installer == 'pip'
        run: pip install -r requirements.txt

      - name: Install dev tools (pip)
        if: steps.deps.outputs.installer == 'pip'
        run: pip install ruff pytest pip-audit pip-licenses

      - name: Lint (uv)
        if: steps.deps.outputs.installer == 'uv'
        run: uv run --frozen ruff check .

      - name: Lint (pip)
        if: steps.deps.outputs.installer == 'pip'
        run: ruff check .

      - name: Test (uv)
        if: steps.deps.outputs.installer == 'uv'
        run: uv run --frozen pytest

      - name: Test (pip)
        if: steps.deps.outputs.installer == 'pip'
        run: pytest

      - name: Security - Secret detection (gitleaks)
        run: |
          # BL-151: run the gitleaks CLI directly — gitleaks-action needs GITLEAKS_LICENSE
          # for org accounts and a full clone; the CLI needs neither and mirrors the local hook.
          # `gitleaks git` scans full history — hence fetch-depth: 0 on checkout.
          GITLEAKS_VERSION=8.30.1
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --exit-code 1

      - name: Security - Dependency audit (uv)
        if: steps.deps.outputs.installer == 'uv'
        run: uv run --frozen pip-audit

      - name: Security - Dependency audit (pip)
        if: steps.deps.outputs.installer == 'pip'
        run: pip-audit

      # BL-318-G3-LICENSES: the same deny list on both paths.
      # BL-318-G3-SELF-LICENSE: `uv sync` installs a packaged project itself, so
      # pip-licenses would list it and fail it on its own license. The deny list
      # is for dependencies (the pip path never installs the project), so the
      # project is left out under the name `uv version` reports ("<name>
      # <version>", the name normalised as pip-licenses compares it). With no
      # name to report (no [project] table), nothing is left out.
      - name: Security - License check (uv)
        if: steps.deps.outputs.installer == 'uv'
        shell: bash
        run: |
          self="$(uv version --frozen 2>/dev/null | awk 'NR == 1 { print $1 }')" || self=""
          set --
          [ -z "$self" ] || set -- --ignore-packages "$self"
          uv run --frozen pip-licenses "$@" --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3);GNU Lesser General Public License v2 (LGPLv2);GNU Lesser General Public License v2.1 (LGPLv2.1);GNU Lesser General Public License v3 (LGPLv3);Server Side Public License (SSPL);European Union Public Licence 1.1 (EUPL 1.1);European Union Public Licence 1.2 (EUPL 1.2)"
        # MPL-2.0 has file-level copyleft — review on a case-by-case basis if detected

      - name: Security - License check (pip)
        if: steps.deps.outputs.installer == 'pip'
        run: pip-licenses --fail-on="GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3);GNU Lesser General Public License v2 (LGPLv2);GNU Lesser General Public License v2.1 (LGPLv2.1);GNU Lesser General Public License v3 (LGPLv3);Server Side Public License (SSPL);European Union Public Licence 1.1 (EUPL 1.1);European Union Public Licence 1.2 (EUPL 1.2)"
        # MPL-2.0 has file-level copyleft — review on a case-by-case basis if detected

      - name: Security - Lockfile integrity
        env:
          # BL-318-G3-LOCK-CHECK: the installer the decision step chose. For uv,
          # `uv lock --check` reports a uv.lock that no longer matches
          # pyproject.toml (it never writes); `uv sync --frozen` above installed
          # the lockfile as it is, without checking.
          INSTALLER: ${{ steps.deps.outputs.installer }}
        shell: bash
        run: |
          if [ "$INSTALLER" = "uv" ]; then
            uv lock --check || echo "::warning::uv lock --check failed: uv.lock may not match pyproject.toml (see the output above). Run uv lock and commit uv.lock."
          elif [ -f "requirements.txt" ] && grep -q -- '--hash' requirements.txt; then
            pip install --require-hashes -r requirements.txt --dry-run 2>/dev/null || echo "::warning::Hash verification failed — review requirements.txt hashes"
          elif [ -f "Pipfile.lock" ]; then
            pipenv verify 2>/dev/null || echo "::warning::Pipfile.lock integrity check unavailable (pipenv not installed)"
          elif [ -f "poetry.lock" ]; then
            poetry check --lock 2>/dev/null || echo "::warning::poetry.lock integrity check unavailable (poetry not installed)"
          else
            echo "::warning::No hash-pinned lockfile found. Consider pip-compile --generate-hashes for supply chain integrity."
          fi

      - name: Governance - Approval log integrity
        if: hashFiles('APPROVAL_LOG.md') != ''
        env:
          # BL-164: github context enters the shell via env:, never by direct
          # template expansion inside run: (actions shell-injection hardening;
          # semgrep run-shell-injection flags the expanded form at ERROR).
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # BL-147: resolve the diff base explicitly and fail LOUDLY if it cannot be resolved.
          # A default-depth checkout has no origin/main ref; a check that cannot run must not pass.
          BASE="origin/${BASE_REF}"
          if [ "$EVENT_NAME" = "push" ]; then BASE="$EVENT_BEFORE"; fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::ref creation — no prior APPROVAL_LOG history to compare"; exit 0
          fi
          git fetch origin "$BASE_REF" --quiet || true
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null; then
            echo "::error::approval-log check cannot resolve base '$BASE' — failing LOUDLY (a check that cannot run must not pass)"; exit 1
          fi
          if git diff "$BASE...HEAD" -- APPROVAL_LOG.md | grep -qE '^\-[^-]'; then
            echo "::error::APPROVAL_LOG.md has deleted or modified lines. This file is append-only."; exit 1
          fi

      - name: Governance - Approval author verification
        if: hashFiles('APPROVAL_LOG.md') != ''
        env:
          # BL-164: github context enters the shell via env:, never by direct
          # template expansion inside run: (actions shell-injection hardening;
          # semgrep run-shell-injection flags the expanded form at ERROR).
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # BL-147: same explicit-base + loud-fail resolution as the integrity step.
          BASE="origin/${BASE_REF}"
          if [ "$EVENT_NAME" = "push" ]; then BASE="$EVENT_BEFORE"; fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::ref creation — no prior APPROVAL_LOG history to compare"; exit 0
          fi
          git fetch origin "$BASE_REF" --quiet || true
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null; then
            echo "::error::approval-author check cannot resolve base '$BASE' — failing LOUDLY (a check that cannot run must not pass)"; exit 1
          fi
          # When APPROVAL_LOG.md is modified, check the commit author against the listed approver.
          if git diff --name-only "$BASE...HEAD" | grep -q 'APPROVAL_LOG.md'; then
            COMMIT_AUTHOR=$(git log --format='%an' "$BASE...HEAD" -- APPROVAL_LOG.md | head -1)
            ADDED_LINES=$(git diff "$BASE...HEAD" -- APPROVAL_LOG.md | grep '^+' | grep -i 'Approver' | head -1 || true)
            if [ -n "$ADDED_LINES" ] && [ -n "$COMMIT_AUTHOR" ]; then
              APPROVER_NAME=$(echo "$ADDED_LINES" | awk -F'|' '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); gsub(/\*/, "", $3); gsub(/\+/, "", $3); print $3 }' | xargs)
              if [ -n "$APPROVER_NAME" ] && [ "$APPROVER_NAME" != "$COMMIT_AUTHOR" ]; then
                echo "::warning::Commit author ($COMMIT_AUTHOR) differs from listed approver ($APPROVER_NAME). Verify this is intentional."
                # Organizations wanting hard enforcement: change ::warning:: to ::error:: and uncomment: exit 1
              fi
            fi
          fi

      - name: Governance - Phase gate check
        # PHASE-GATE CREDENTIALS (walk ISSUE-006): the Phase 1-2 branch-protection backstop needs a host API token this runner does not have.
        # GitHub Actions exports NO token into a step environment, and even a mapped
        # secrets.GITHUB_TOKEN cannot read branch protection — the workflow
        # `permissions:` block has no `administration` key. So that ONE check prints a
        # loud [WARN] "could NOT run" here instead of failing the job. It is
        # UNVERIFIED on this runner, NOT satisfied, and it still BLOCKS on the dev
        # workstation (scripts/check-gate.sh --preflight).
        # >> STRONGLY RECOMMENDED — clear this warning permanently. ONE guided
        # command sets up real enforcement end to end: it explains what the
        # token is for, walks you through a least-privilege fine-grained PAT
        # (Administration: Read-only, this repository only), PROVES the token
        # can read protection before storing anything, and sets the Actions
        # secret this step already reads:
        #
        #     scripts/check-gate.sh --setup-ci-token
        #
        # The wiring is LIVE below — no editing needed. An unset secret
        # evaluates to the empty string, which the gate reads as "no
        # credential" (that is today's warning); once the secret exists the
        # backstop enforces on the very next push. That claim holds because
        # the `run:` below lets the gate's EXIT CODE decide this step — do not
        # "soften" it with `|| echo` / `|| true`: that discards the verdict, so
        # the gate can print [FAIL] and exit 1 while the step still grades
        # GREEN, and no token can enforce anything through it.
        # A warning nobody clears is a check nobody reads.
        if: hashFiles('.claude/phase-state.json') != ''
        env:
          # WALK-ISSUE-006 wiring: set by `scripts/check-gate.sh --setup-ci-token`.
          # Unset -> empty string -> the gate WARNs (cannot verify). Set -> the
          # gate enforces. secrets.GITHUB_TOKEN would NOT work here: it has no
          # `administration` permission and cannot read branch protection.
          GH_TOKEN: ${{ secrets.SOIF_PROTECTION_TOKEN }}
        run: |
          if [ ! -f scripts/check-phase-gate.sh ]; then
            echo "::error::Phase gate check script missing. Framework integrity compromised."
            exit 1
          fi
          bash scripts/check-phase-gate.sh

      - name: Governance - Changelog check
        run: bash scripts/check-changelog.sh
        # Tier 1.5: warning only. Set SOIF_STRICT_CHANGELOG=true to block.
        # env:
        #   SOIF_STRICT_CHANGELOG: "true"

      - name: Governance - Session state check
        run: bash scripts/check-session-state.sh
        # Tier 1.5: warning only. Set SOIF_STRICT_SESSION=true to block.
        # env:
        #   SOIF_STRICT_SESSION: "true"

  # BL-148: SAST runs in the semgrep/semgrep container (replaces the archived
  # Semgrep GitHub Action). The scan's config + severity flags MIRROR the local
  # pre-commit hook (scripts/lib/hook-templates.sh) so CI and the dev gate enforce
  # the IDENTICAL ruleset. semgrep/semgrep is Alpine-based; GitHub's runner detects
  # that and runs JS actions (checkout) with its musl node build, so checkout works.
  sast:
    runs-on: ubuntu-latest
    container:
      # BL-201-FLOAT: the tag floats deliberately — a pinned scanner silently stops catching new vulnerabilities (backlog BL-201); the job logs semgrep --version. Do not re-pin without reversing that decision.
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          fetch-depth: 0
      - name: Security - SAST scanner version
        run: semgrep --version
      - name: Security - SAST (Semgrep)
        run: semgrep scan --config=p/owasp-top-ten --config=r/javascript.browser.security.insecure-document-method --config=.semgrep/soif-dom-sinks.yml --severity=ERROR --error
