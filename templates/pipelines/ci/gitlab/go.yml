# solo-orchestrator: platforms=web,desktop,mcp_server
# GitLab CI pipeline for Go projects.
stages: [test, security, governance]
image: golang:1.21
cache:
  key: "${CI_COMMIT_REF_SLUG}-go"
  paths: [/go/pkg/mod/]
lint:
  stage: test
  script:
    - gofmt -l . | tee /tmp/fmt.out; [ ! -s /tmp/fmt.out ]
    - go vet ./...
test:
  stage: test
  script: [go test ./...]
sast:
  stage: security
  # BL-201-FLOAT: the tag floats deliberately — a pinned scanner silently stops catching new vulnerabilities (backlog BL-201); the job logs semgrep --version. Do not re-pin without reversing that decision.
  image: semgrep/semgrep:latest
  script: [semgrep --version, semgrep scan --config=p/owasp-top-ten --config=r/javascript.browser.security.insecure-document-method --config=.semgrep/soif-dom-sinks.yml --severity=ERROR --error]
secrets:
  stage: security
  image: ghcr.io/gitleaks/gitleaks:v8.30.1
  script: [gitleaks dir . --verbose --redact]
dependencies:
  stage: security
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
licenses:
  stage: security
  script:
    - go install github.com/google/go-licenses@latest
    - go-licenses check ./... 2>&1 | grep -iE "GPL|AGPL|SSPL" && exit 1 || true
governance:
  stage: governance
  image: bash:5
  script:
    - apk add --no-cache jq git
    # PHASE-GATE CREDENTIALS (walk ISSUE-006): the Phase 1-2 branch-protection backstop needs a host API token this runner does not have.
    # This job installs only jq+git: there is no `glab` client, and CI_JOB_TOKEN
    # cannot read protected-branch settings. So that ONE check prints a loud
    # [WARN] "could NOT run" here instead of failing the job. It is UNVERIFIED on
    # this runner, NOT satisfied, and it still BLOCKS on the dev workstation
    # (scripts/check-gate.sh --preflight).
    # For HARD enforcement in CI, add a masked CI/CD variable GITLAB_TOKEN (a PAT
    # with `api` scope) and install glab in this job — the backstop blocks again.
    - bash scripts/check-phase-gate.sh
    - bash scripts/check-changelog.sh 2>/dev/null || true
